apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-sbti
  annotations:
    acme.cert-manager.io/http01-edit-in-place: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    cert-manager.io/issue-temporary-certificate: "true"
spec:
  ingressClassName: nginx
  tls:
    - secretName: my-sbti-live-tls
      hosts:
        - my-sbti.lol
        - www.my-sbti.lol
  rules:
    - host: my-sbti.lol
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: my-sbti
                port:
                  number: 80
    - host: www.my-sbti.lol
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: my-sbti
                port:
                  number: 80
