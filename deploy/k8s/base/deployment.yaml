apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-sbti
  labels:
    app.kubernetes.io/name: my-sbti
    app.kubernetes.io/part-of: my-sbti
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: my-sbti
      app.kubernetes.io/part-of: my-sbti
  template:
    metadata:
      labels:
        app.kubernetes.io/name: my-sbti
        app.kubernetes.io/part-of: my-sbti
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      imagePullSecrets:
        - name: dokploy-fleet-ghcr
      containers:
        - name: web
          image: registry.144.91.77.245.sslip.io/my-sbti:bootstrap
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_ENV
              value: production
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: 0.0.0.0
          envFrom:
            - configMapRef:
                name: my-sbti-runtime
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            initialDelaySeconds: 5
            periodSeconds: 10
            tcpSocket:
              port: 3000
          livenessProbe:
            initialDelaySeconds: 15
            periodSeconds: 20
            tcpSocket:
              port: 3000
          startupProbe:
            failureThreshold: 30
            periodSeconds: 5
            tcpSocket:
              port: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
